<body>

  <!-- Gate Easter Egg Trigger -->
  <div class="gate-container" id="gate-trigger" role="button" aria-label="Mysterious Gate" onclick="triggerGate()">
    <img src="assets/gate.png" alt="Gate" class="gate-icon">
    <img src="assets/gate_red.png" alt="Gate Tint" class="gate-icon gate-red">
  </div>

  <!-- Hero Landing Section -->
  <section class="hero-section">
    <div class="hero-container">
      <h1 class="title-line peep">PEEP</h1>
      <div class="title-line into-the">INTO THE</div>
      <h1 class="title-line nheep">NHEEP</h1>
    </div>
    
    <!-- Minimalist Scroll Down Indicator -->
    <div class="scroll-indicator" aria-hidden="true">
      <svg class="chevron-down" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M6 9L12 15L18 9" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </section>

  <!-- Game Collection Section -->
  <main class="collection-section">
    <header class="section-header">
      <h2 class="section-title">GAME COLLECTION</h2>
      <div class="section-underline"></div>
    </header>

    <div class="games-grid">
      
      <!-- Card 1: Low Poly World -->
      <div class="game-card" id="lpw-card">
        <div class="card-media-wrapper">
          <a href="https://lpw.nheep.com" target="_blank" rel="noopener noreferrer">
            <div class="video-placeholder" id="lpw-placeholder">
              <p class="placeholder-text">Empty, Videos<br>will go here<br>later</p>
            </div>
          </a>
          <div class="key-easter-egg" id="lpw-key" onclick="triggerKey(event)" role="button" aria-label="Golden Key"></div>
        </div>
        <h3 class="game-title">Low Poly World</h3>
      </div>

      <!-- Card 2: Untitled Tower Defense -->
      <div class="game-card" id="untitled-tower-defense-card">
        <a href="https://tds.nheep.com" target="_blank" rel="noopener noreferrer">
          <div class="video-placeholder video-player-card">
            <!-- Video elements for seamless sliding transitions -->
            <div class="video-slider-container">
              <video class="slide-video" muted playsinline></video>
              <video class="slide-video" muted playsinline></video>
            </div>
          </div>
        </a>
        <h3 class="game-title">Untitled Tower Defense</h3>
      </div>

      <!-- Card 3: Knight's Quest -->
      <div class="game-card" id="knights-quest-card">
        <a href="https://kquest.nheep.com" target="_blank" rel="noopener noreferrer">
          <div class="video-placeholder video-player-card">
            <!-- Video elements for seamless sliding transitions -->
            <div class="video-slider-container">
              <video class="slide-video" muted playsinline></video>
              <video class="slide-video" muted playsinline></video>
            </div>
          </div>
        </a>
        <h3 class="game-title">Knight's Quest</h3>
      </div>

      <!-- Card 4: Empty -->
      <div class="game-card">
        <div class="video-placeholder">
          <p class="placeholder-text">Empty, Videos<br>will go here<br>later</p>
        </div>
        <h3 class="game-title">Empty</h3>
      </div>

    </div>
  </main>

  <!-- Multi-Card Video Slider Controller -->
  <script>
    function triggerGate() {
      const gate = document.getElementById('gate-trigger');
      if (gate) {
        gate.classList.remove('clicked');
        void gate.offsetWidth; // Force reflow
        gate.classList.add('clicked');
        // ponytail: simple timeout to remove clicked class and trigger CSS transition back
        setTimeout(() => {
          gate.classList.remove('clicked');
        }, 100);
      }
    }

    function triggerKey(event) {
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }
      const key = document.getElementById('lpw-key');
      const placeholder = document.getElementById('lpw-placeholder');
      if (key && placeholder) {
        key.classList.add('hidden-behind');
        placeholder.classList.add('yellow-outline');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      // Configuration for multiple video card sliders
      const slidersConfig = [
        {
          id: 'knights-quest-card',
          clips: [
            'assets/kq_clip1.mp4',
            'assets/kq_clip2.mp4',
            'assets/kq_clip3.mp4',
            'assets/kq_clip4.mp4'
          ]
        },
        {
          id: 'untitled-tower-defense-card',
          clips: [
            'assets/tds_clip1.mp4',
            'assets/tds_clip2.mp4',
            'assets/tds_clip3.mp4',
            'assets/tds_clip4.mp4'
          ]
        }
      ];

      slidersConfig.forEach(config => {
        const card = document.getElementById(config.id);
        if (!card) return;

        const placeholderBox = card.querySelector('.video-placeholder');
        const videos = [
          card.querySelector('.slide-video:nth-child(1)'),
          card.querySelector('.slide-video:nth-child(2)')
        ];

        // Shuffle clips dynamically on page load
        let shuffledClips = [...config.clips].sort(() => Math.random() - 0.5);
        
        let activeIdx = 0;  // Index in videos array (0 or 1)
        let clipIdx = 0;    // Index in shuffledClips
        let isHovered = false;
        let transitionTimeout = null;
        let checkInterval = null;

        // Preload video elements immediately on page load for instant start on hover
        function preloadVideos() {
          if (shuffledClips.length === 0) return;
          
          const activeVideo = videos[0];
          const nextVideo = videos[1];
          
          activeVideo.muted = true;
          activeVideo.playsInline = true;
          activeVideo.src = shuffledClips[clipIdx];
          activeVideo.className = 'slide-video active-video';
          activeVideo.load();
          
          if (shuffledClips.length > 1) {
            const nextClipIdx = (clipIdx + 1) % shuffledClips.length;
            nextVideo.muted = true;
            nextVideo.playsInline = true;
            nextVideo.src = shuffledClips[nextClipIdx];
            nextVideo.className = 'slide-video next-video';
            nextVideo.load();
          }
        }

        // Run preloader instantly
        preloadVideos();

        function pausePlayback() {
          isHovered = false;
          clearTimeout(transitionTimeout);
          clearInterval(checkInterval);
          
          videos.forEach(v => {
            v.pause();
            v.currentTime = 0; // Reset time to play fresh on next hover entry
          });
        }

        function startPlayback() {
          if (shuffledClips.length === 0) return;
          isHovered = true;
          
          const activeVideo = videos[activeIdx];
          const nextVideo = videos[1 - activeIdx];
          
          activeVideo.muted = true;
          activeVideo.playsInline = true;
          
          // Ensure it starts from the beginning if it was ended or stuck
          if (activeVideo.ended || activeVideo.currentTime >= 7.0) {
            activeVideo.currentTime = 0;
          }
          
          const playVideo = () => {
            if (!isHovered) return;
            activeVideo.play().then(() => {
              if (shuffledClips.length > 1) {
                monitorTransition(activeVideo, nextVideo);
              }
            }).catch(err => {
              console.warn("Autoplay failed, retrying on canplay:", err);
              activeVideo.addEventListener('canplay', () => {
                if (isHovered) {
                  activeVideo.play().catch(e => console.error("Final play retry failed:", e));
                }
              }, { once: true });
            });
          };

          if (activeVideo.readyState >= 2) { // HAVE_CURRENT_DATA
            playVideo();
          } else {
            activeVideo.addEventListener('canplay', playVideo, { once: true });
            activeVideo.load();
          }
        }

        function monitorTransition(activeVideo, nextVideo) {
          clearInterval(checkInterval);
          
          // Sliced clips are exactly 7.0 seconds. 
          // With a slower 1.4s transition, we trigger the transition exactly 1.4s before finishing (at 5.6s)
          // so it completes exactly at 7.0 seconds!
          const triggerTime = 5.6; 
          
          checkInterval = setInterval(() => {
            if (!isHovered) return;
            
            if (activeVideo.currentTime >= triggerTime) {
              clearInterval(checkInterval);
              triggerTransition(activeVideo, nextVideo);
            }
          }, 30);
        }

        function triggerTransition(activeVideo, nextVideo) {
          if (!isHovered || shuffledClips.length <= 1) return;

          nextVideo.muted = true;
          nextVideo.playsInline = true;
          
          const playNext = () => {
            if (!isHovered) return;
            nextVideo.play().then(() => {
              // Slide active video out left, next video in from right
              activeVideo.classList.add('slide-left');
              activeVideo.classList.remove('active-video');
              
              nextVideo.classList.add('slide-in');
              nextVideo.classList.remove('next-video');
              
              // Synchronize swap with the 1.4s CSS slide animation duration
              transitionTimeout = setTimeout(() => {
                if (!isHovered) return;
                
                activeVideo.pause();
                activeVideo.className = 'slide-video next-video'; // Move to standby position
                nextVideo.className = 'slide-video active-video'; // Settle as active
                
                activeIdx = 1 - activeIdx; // Swap active video element index
                clipIdx = (clipIdx + 1) % shuffledClips.length; // Advance clip pointer
                
                // Pre-load new clip into standby element
                const incomingClipIdx = (clipIdx + 1) % shuffledClips.length;
                activeVideo.muted = true;
                activeVideo.playsInline = true;
                activeVideo.src = shuffledClips[incomingClipIdx];
                activeVideo.load();
                
                monitorTransition(nextVideo, activeVideo);
              }, 1400);
            }).catch(err => {
              console.warn("Standby video play blocked, bypassing transition:", err);
              fallbackImmediateJump(activeVideo, nextVideo);
            });
          };

          if (nextVideo.readyState >= 2) {
            playNext();
          } else {
            nextVideo.addEventListener('canplay', playNext, { once: true });
            nextVideo.load();
          }
        }

        function fallbackImmediateJump(activeVideo, nextVideo) {
          activeVideo.pause();
          activeVideo.className = 'slide-video next-video';
          nextVideo.className = 'slide-video active-video';
          
          activeIdx = 1 - activeIdx;
          clipIdx = (clipIdx + 1) % shuffledClips.length;
          
          const incomingClipIdx = (clipIdx + 1) % shuffledClips.length;
          activeVideo.muted = true;
          activeVideo.playsInline = true;
          activeVideo.src = shuffledClips[incomingClipIdx];
          activeVideo.load();
          
          monitorTransition(nextVideo, activeVideo);
        }

        placeholderBox.addEventListener('mouseenter', () => {
          if (!isHovered) {
            startPlayback();
          }
        });

        placeholderBox.addEventListener('mousemove', () => {
          if (!isHovered) {
            startPlayback();
          }
        });

        placeholderBox.addEventListener('mouseleave', () => {
          pausePlayback();
        });

        // Handle background tab throttling/desync bugs elegantly
        document.addEventListener('visibilitychange', () => {
          if (document.hidden) {
            pausePlayback();
          }
        });
      });

    });
  </script>

  <!-- Magic Mouse Trail Canvas -->
  <canvas id="magic-trail" class="magic-trail-canvas"></canvas>

  <!-- Magic Mouse Trail Script -->
  <script>
    // ponytail: smooth purple-blue magic comet & sparkle trail with 0 dependencies
    (() => {
      const canvas = document.getElementById('magic-trail');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');

      let width = window.innerWidth;
      let height = window.innerHeight;
      let dpr = Math.min(window.devicePixelRatio || 1, 2);

      function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
      }
      window.addEventListener('resize', resize);
      resize();

      // Mouse history for smooth glowing comet ribbon
      const trailPoints = [];
      const maxTrailPoints = 28;

      // Stardust & Sparkle particles
      const particles = [];
      let lastPos = null;
      let isMoving = false;
      let idleTimer = null;

      function createParticle(x, y, isSparkle = false, speedMult = 1) {
        // Purple-blue spectrum: 215 (electric blue) -> 250 (indigo) -> 280 (neon purple) -> 295 (magenta accent)
        const hue = 215 + Math.random() * 75;
        const angle = Math.random() * Math.PI * 2;
        const speed = (Math.random() * 1.6 + 0.4) * speedMult;
        return {
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 0.35, // buoyant upward drift
          size: isSparkle ? (Math.random() * 7 + 4.5) : (Math.random() * 5.5 + 3.5),
          maxLife: isSparkle ? Math.floor(Math.random() * 20 + 35) : Math.floor(Math.random() * 18 + 28),
          life: 0,
          hue,
          sat: 90 + Math.random() * 10,
          light: 65 + Math.random() * 25,
          isSparkle,
          rot: Math.random() * Math.PI,
          rotSpeed: (Math.random() - 0.5) * 0.15
        };
      }

      function handlePointer(x, y) {
        trailPoints.unshift({ x, y, age: 0 });
        if (trailPoints.length > maxTrailPoints) {
          trailPoints.pop();
        }

        if (lastPos) {
          const dx = x - lastPos.x;
          const dy = y - lastPos.y;
          const dist = Math.hypot(dx, dy);

          // Interpolate along movement vector for uninterrupted particle dispersion
          const steps = Math.min(10, Math.max(1, Math.floor(dist / 6)));
          for (let i = 0; i < steps; i++) {
            const t = i / steps;
            const px = lastPos.x + dx * t;
            const py = lastPos.y + dy * t;

            // Glowing stardust orb
            particles.push(createParticle(px, py, false, Math.min(dist * 0.05, 2)));

            // Sparkling 4-point star
            if (Math.random() < 0.35) {
              particles.push(createParticle(px, py, true, 1.2));
            }
          }
        } else {
          particles.push(createParticle(x, y, true, 1));
        }

        lastPos = { x, y };
        isMoving = true;
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => {
          isMoving = false;
          lastPos = null;
        }, 120);

        if (particles.length > 200) {
          particles.splice(0, particles.length - 200);
        }
      }

      window.addEventListener('pointermove', (e) => handlePointer(e.clientX, e.clientY), { passive: true });
      window.addEventListener('mousemove', (e) => handlePointer(e.clientX, e.clientY), { passive: true });
      window.addEventListener('touchmove', (e) => {
        if (e.touches && e.touches.length > 0) {
          handlePointer(e.touches[0].clientX, e.touches[0].clientY);
        }
      }, { passive: true });

      window.addEventListener('pointerleave', () => {
        lastPos = null;
        isMoving = false;
      });

      function drawSparkleStar(ctx, x, y, size, angle) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        ctx.beginPath();
        for (let i = 0; i < 4; i++) {
          const a = (i * Math.PI) / 2;
          const nextA = a + Math.PI / 4;
          ctx.lineTo(Math.cos(a) * size, Math.sin(a) * size);
          ctx.lineTo(Math.cos(nextA) * (size * 0.22), Math.sin(nextA) * (size * 0.22));
        }
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      function render() {
        requestAnimationFrame(render);

        // If nothing to draw, clear and skip
        if (trailPoints.length === 0 && particles.length === 0) {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          return;
        }

        ctx.save();
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.scale(dpr, dpr);
        ctx.globalCompositeOperation = 'lighter'; // Additive blending for magical glow

        // 1. Draw glowing ribbon trail
        if (trailPoints.length > 2) {
          // Age and prune trail points
          for (let i = trailPoints.length - 1; i >= 0; i--) {
            trailPoints[i].age++;
            if (trailPoints[i].age > maxTrailPoints) {
              trailPoints.splice(i, 1);
            }
          }

          // Draw multi-layer smooth ribbon with quadratic curves
          const layers = [
            { width: 15, color: 'rgba(139, 92, 246, 0.25)' }, // Outer purple aura
            { width: 8,  color: 'rgba(59, 130, 246, 0.5)' },   // Mid electric blue
            { width: 3,  color: 'rgba(235, 240, 255, 0.9)' }   // Inner glowing white core
          ];

          layers.forEach(layer => {
            ctx.beginPath();
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = layer.color;
            ctx.lineWidth = layer.width;

            ctx.moveTo(trailPoints[0].x, trailPoints[0].y);
            for (let i = 1; i < trailPoints.length - 1; i++) {
              const xc = (trailPoints[i].x + trailPoints[i + 1].x) / 2;
              const yc = (trailPoints[i].y + trailPoints[i + 1].y) / 2;
              ctx.quadraticCurveTo(trailPoints[i].x, trailPoints[i].y, xc, yc);
            }
            ctx.stroke();
          });
        }

        // 2. Draw stardust & sparkle particles
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.life++;
          if (p.life >= p.maxLife) {
            particles.splice(i, 1);
            continue;
          }

          const progress = 1 - p.life / p.maxLife; // 1 -> 0
          p.x += p.vx;
          p.y += p.vy;
          p.vx *= 0.94;
          p.vy *= 0.94;
          p.rot += p.rotSpeed;

          const currentSize = p.size * Math.pow(progress, 0.7);
          const alpha = progress * 0.95;

          ctx.fillStyle = `hsla(${p.hue}, ${p.sat}%, ${p.light}%, ${alpha})`;

          if (p.isSparkle) {
            drawSparkleStar(ctx, p.x, p.y, currentSize * 1.6, p.rot);
          } else {
            ctx.beginPath();
            ctx.arc(p.x, p.y, Math.max(0.5, currentSize), 0, Math.PI * 2);
            ctx.fill();
          }
        }

        // 3. Glowing wand tip at current mouse position
        if (trailPoints.length > 0 && isMoving) {
          const head = trailPoints[0];
          const grad = ctx.createRadialGradient(head.x, head.y, 0, head.x, head.y, 16);
          grad.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
          grad.addColorStop(0.3, 'rgba(168, 85, 247, 0.7)');
          grad.addColorStop(0.7, 'rgba(59, 130, 246, 0.3)');
          grad.addColorStop(1, 'rgba(59, 130, 246, 0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(head.x, head.y, 16, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();
      }

      render();
    })();
  </script>
